<!DOCTYPE html>
<!-- Cursor UI 디자인 갤러리 정적 페이지 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키치 디자인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        
        body {
            background: repeating-linear-gradient(
                45deg,
                #ff69b4,
                #ff69b4 10px,
                #ff1493 10px,
                #ff1493 20px
            );
            font-family: 'Pacifico', cursive;
        }
        .kitsch-card {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid gold;
            box-shadow: 
                0 0 15px rgba(255, 105, 180, 0.7),
                0 0 30px rgba(255, 20, 147, 0.5);
            animation: rainbow-border 3s linear infinite;
        }
        @keyframes rainbow-border {
            0% { border-color: red; }
            20% { border-color: yellow; }
            40% { border-color: lime; }
            60% { border-color: cyan; }
            80% { border-color: magenta; }
            100% { border-color: red; }
        }
        .sparkle {
            animation: sparkle 1.5s ease-in-out infinite;
        }
        @keyframes sparkle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <a href="index.html" class="kitsch-card fixed top-4 left-4 px-4 py-2 rounded-full text-pink-500">
        ← 돌아가기
    </a>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-5xl text-white text-center mb-12 sparkle">✨ 키치 디자인 ✨</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="kitsch-card rounded-2xl p-8 transform rotate-1">
                    <div class="text-6xl mb-4 sparkle">📄</div>
                    <h2 class="text-2xl text-pink-500 mb-2">문서</h2>
                    <p class="text-purple-600">문서 관리 시스템</p>
                </div>
                            <div class="kitsch-card rounded-2xl p-8 transform rotate-1">
                    <div class="text-6xl mb-4 sparkle">⚙️</div>
                    <h2 class="text-2xl text-pink-500 mb-2">설정</h2>
                    <p class="text-purple-600">시스템 환경 설정</p>
                </div>
                            <div class="kitsch-card rounded-2xl p-8 transform rotate-1">
                    <div class="text-6xl mb-4 sparkle">📊</div>
                    <h2 class="text-2xl text-pink-500 mb-2">통계</h2>
                    <p class="text-purple-600">데이터 분석 및 통계</p>
                </div>
                    </div>

        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-6">
                            <button class="kitsch-card px-6 py-3 rounded-full text-pink-500 font-bold sparkle">
                    ★ 설정 ★
                </button>
                            <button class="kitsch-card px-6 py-3 rounded-full text-pink-500 font-bold sparkle">
                    ★ 저장 ★
                </button>
                            <button class="kitsch-card px-6 py-3 rounded-full text-pink-500 font-bold sparkle">
                    ★ 공유 ★
                </button>
                            <button class="kitsch-card px-6 py-3 rounded-full text-pink-500 font-bold sparkle">
                    ★ 삭제 ★
                </button>
                    </div>

        <nav class="mt-12 flex justify-center space-x-8">
                            <a href="#" class="kitsch-card px-4 py-2 rounded-full text-pink-500">
                    ♥ 홈 ♥
                </a>
                            <a href="#" class="kitsch-card px-4 py-2 rounded-full text-pink-500">
                    ♥ 소개 ♥
                </a>
                            <a href="#" class="kitsch-card px-4 py-2 rounded-full text-pink-500">
                    ♥ 서비스 ♥
                </a>
                            <a href="#" class="kitsch-card px-4 py-2 rounded-full text-pink-500">
                    ♥ 문의 ♥
                </a>
                    </nav>
    </div>
</body>
</html>
