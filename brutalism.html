<!DOCTYPE html>
<!-- AI UI 디자인 갤러리 정적 페이지 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>브루탈리즘 디자인</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        
        body {
            font-family: 'Courier Prime', monospace;
            background: #ffff00;
            cursor: crosshair;
        }
        .brutal-card {
            background: #ffffff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0 #000;
        }
        .brutal-button {
            background: #000;
            border: 3px solid #000;
            box-shadow: 5px 5px 0 #000;
        }
        .brutal-button:hover {
            background: #ff0000;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 #000;
        }
        .marquee {
            background: #000;
            color: #ff0000;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script defer src="theme.js"></script>
</head>
<body class="min-h-screen p-8">
    <div class="marquee mb-8 text-center text-xl p-2">! ! ! BRUTAL DESIGN SYSTEM ! ! !</div>
    
    <a href="index.html" class="brutal-button fixed top-4 left-4 px-4 py-2 text-white">← BACK</a>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-6xl font-bold text-black text-center mb-12 transform -rotate-2" 
            style="text-shadow: 4px 4px 0 #ff0000">
            브루탈리즘 디자인
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                            <div class="brutal-card p-6 transform rotate-1">
                    <div class="text-6xl mb-4">📄</div>
                    <h2 class="text-2xl font-bold mb-2 uppercase">문서</h2>
                    <p class="text-base">문서 관리 시스템</p>
                </div>
                            <div class="brutal-card p-6 transform rotate-1">
                    <div class="text-6xl mb-4">⚙️</div>
                    <h2 class="text-2xl font-bold mb-2 uppercase">설정</h2>
                    <p class="text-base">시스템 환경 설정</p>
                </div>
                            <div class="brutal-card p-6 transform rotate-1">
                    <div class="text-6xl mb-4">📊</div>
                    <h2 class="text-2xl font-bold mb-2 uppercase">통계</h2>
                    <p class="text-base">데이터 분석 및 통계</p>
                </div>
                    </div>

        <div class="mt-16 grid grid-cols-2 md:grid-cols-4 gap-8">
                            <button class="brutal-button p-4 text-white font-bold uppercase">
                    설정_
                </button>
                            <button class="brutal-button p-4 text-white font-bold uppercase">
                    저장_
                </button>
                            <button class="brutal-button p-4 text-white font-bold uppercase">
                    공유_
                </button>
                            <button class="brutal-button p-4 text-white font-bold uppercase">
                    삭제_
                </button>
                    </div>

        <nav class="mt-16 flex justify-center space-x-8">
                            <a href="#" class="brutal-button px-4 py-2 text-white font-bold uppercase">
                    홈_
                </a>
                            <a href="#" class="brutal-button px-4 py-2 text-white font-bold uppercase">
                    소개_
                </a>
                            <a href="#" class="brutal-button px-4 py-2 text-white font-bold uppercase">
                    서비스_
                </a>
                            <a href="#" class="brutal-button px-4 py-2 text-white font-bold uppercase">
                    문의_
                </a>
                    </nav>
    </div>
</body>
</html>
