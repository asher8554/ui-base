<!DOCTYPE html>
<!-- AI UI 디자인 갤러리 정적 페이지 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>글래스모피즘 디자인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Tailwind 기본 유틸리티에 없는 animate-blob을 직접 정의한다 */
        @keyframes blob-move {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.08); }
            66% { transform: translate(-20px, 25px) scale(0.94); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .animate-blob {
            animation: blob-move 12s ease-in-out infinite;
            pointer-events: none;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script defer src="theme.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-red-500 p-8">
    <a href="index.html" class="glass fixed top-4 left-4 px-4 py-2 rounded-full text-white">← 돌아가기</a>
    
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-white text-center mb-12">글래스모피즘 디자인</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="glass rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-300">
                    <div class="text-4xl mb-4">📄</div>
                    <h2 class="text-xl font-semibold text-white mb-2">문서</h2>
                    <p class="text-white/80">문서 관리 시스템</p>
                </div>
                            <div class="glass rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-300">
                    <div class="text-4xl mb-4">⚙️</div>
                    <h2 class="text-xl font-semibold text-white mb-2">설정</h2>
                    <p class="text-white/80">시스템 환경 설정</p>
                </div>
                            <div class="glass rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-300">
                    <div class="text-4xl mb-4">📊</div>
                    <h2 class="text-xl font-semibold text-white mb-2">통계</h2>
                    <p class="text-white/80">데이터 분석 및 통계</p>
                </div>
                    </div>

        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-6">
                            <button class="glass px-6 py-3 rounded-full text-white hover:bg-white/30 transition-all">
                    설정                </button>
                            <button class="glass px-6 py-3 rounded-full text-white hover:bg-white/30 transition-all">
                    저장                </button>
                            <button class="glass px-6 py-3 rounded-full text-white hover:bg-white/30 transition-all">
                    공유                </button>
                            <button class="glass px-6 py-3 rounded-full text-white hover:bg-white/30 transition-all">
                    삭제                </button>
                    </div>

        <nav class="mt-12 flex justify-center space-x-8">
                            <a href="#" class="glass px-4 py-2 rounded-full text-white hover:bg-white/30 transition-all">
                    홈                </a>
                            <a href="#" class="glass px-4 py-2 rounded-full text-white hover:bg-white/30 transition-all">
                    소개                </a>
                            <a href="#" class="glass px-4 py-2 rounded-full text-white hover:bg-white/30 transition-all">
                    서비스                </a>
                            <a href="#" class="glass px-4 py-2 rounded-full text-white hover:bg-white/30 transition-all">
                    문의                </a>
                    </nav>
    </div>

    <!-- 배경 장식 요소 -->
    <div class="fixed top-20 left-20 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <div class="fixed top-40 right-20 w-72 h-72 bg-yellow-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <div class="fixed -bottom-8 left-40 w-72 h-72 bg-pink-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
</body>
</html>
