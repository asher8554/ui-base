<!DOCTYPE html>
<!-- AI UI 디자인 갤러리 정적 페이지 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랫 디자인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <script defer src="theme.js"></script>
</head>
<body class="min-h-screen bg-gray-50 p-8">
    <a href="index.html" class="fixed top-4 left-4 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
        ← 돌아가기
    </a>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-gray-800 text-center mb-12">플랫 디자인</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="bg-white p-8 rounded-lg">
                    <div class="text-4xl mb-4">📄</div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">문서</h2>
                    <p class="text-gray-600">문서 관리 시스템</p>
                </div>
                            <div class="bg-white p-8 rounded-lg">
                    <div class="text-4xl mb-4">⚙️</div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">설정</h2>
                    <p class="text-gray-600">시스템 환경 설정</p>
                </div>
                            <div class="bg-white p-8 rounded-lg">
                    <div class="text-4xl mb-4">📊</div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">통계</h2>
                    <p class="text-gray-600">데이터 분석 및 통계</p>
                </div>
                    </div>

        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-6">
                            <button class="bg-blue-500 text-white p-4 rounded-lg font-medium hover:bg-blue-600 transition-colors">
                    설정                </button>
                            <button class="bg-blue-500 text-white p-4 rounded-lg font-medium hover:bg-blue-600 transition-colors">
                    저장                </button>
                            <button class="bg-blue-500 text-white p-4 rounded-lg font-medium hover:bg-blue-600 transition-colors">
                    공유                </button>
                            <button class="bg-blue-500 text-white p-4 rounded-lg font-medium hover:bg-blue-600 transition-colors">
                    삭제                </button>
                    </div>

        <nav class="mt-12 flex justify-center space-x-8">
                            <a href="#" class="text-gray-600 hover:text-gray-800 transition-colors">
                    홈                </a>
                            <a href="#" class="text-gray-600 hover:text-gray-800 transition-colors">
                    소개                </a>
                            <a href="#" class="text-gray-600 hover:text-gray-800 transition-colors">
                    서비스                </a>
                            <a href="#" class="text-gray-600 hover:text-gray-800 transition-colors">
                    문의                </a>
                    </nav>
    </div>
</body>
</html>
