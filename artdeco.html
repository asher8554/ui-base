<!DOCTYPE html>
<!-- AI UI 디자인 갤러리 정적 페이지 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아르데코 디자인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poiret+One&display=swap');

        body {
            font-family: 'Poiret One', cursive;
            background: #2c3e50;
            background-image: 
                linear-gradient(30deg, #2c3e50 12%, transparent 12.5%, transparent 87%, #2c3e50 87.5%, #2c3e50),
                linear-gradient(150deg, #2c3e50 12%, transparent 12.5%, transparent 87%, #2c3e50 87.5%, #2c3e50),
                linear-gradient(30deg, #2c3e50 12%, transparent 12.5%, transparent 87%, #2c3e50 87.5%, #2c3e50),
                linear-gradient(150deg, #2c3e50 12%, transparent 12.5%, transparent 87%, #2c3e50 87.5%, #2c3e50),
                linear-gradient(60deg, #34495e 25%, transparent 25.5%, transparent 75%, #34495e 75%, #34495e),
                linear-gradient(60deg, #34495e 25%, transparent 25.5%, transparent 75%, #34495e 75%, #34495e);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
        }
        .deco-card {
            background: #f1c40f;
            border: 2px solid #2c3e50;
            position: relative;
        }
        .deco-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(45deg, transparent 48%, #2c3e50 48%, #2c3e50 52%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #2c3e50 48%, #2c3e50 52%, transparent 52%);
            background-size: 30px 30px;
            opacity: 0.1;
        }
        .deco-button {
            background: #e74c3c;
            color: #fff;
            border: 2px solid #2c3e50;
            position: relative;
            transition: all 0.3s ease;
        }
        .deco-button::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: -4px;
            bottom: -4px;
            background: #2c3e50;
            z-index: -1;
        }
        .deco-button:hover {
            transform: translate(2px, 2px);
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script defer src="theme.js"></script>
</head>
<body class="min-h-screen p-8">
    <a href="index.html" class="deco-button fixed top-4 left-4 px-6 py-3 z-10">← 돌아가기</a>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-6xl font-bold text-center text-white mb-12">
            아르데코 디자인
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="deco-card p-8">
                    <div class="text-4xl mb-4">📄</div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">문서</h2>
                    <p class="text-gray-700">문서 관리 시스템</p>
                </div>
                            <div class="deco-card p-8">
                    <div class="text-4xl mb-4">⚙️</div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">설정</h2>
                    <p class="text-gray-700">시스템 환경 설정</p>
                </div>
                            <div class="deco-card p-8">
                    <div class="text-4xl mb-4">📊</div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">통계</h2>
                    <p class="text-gray-700">데이터 분석 및 통계</p>
                </div>
                    </div>

        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-6">
                            <button class="deco-button px-6 py-3 font-bold">
                    설정                </button>
                            <button class="deco-button px-6 py-3 font-bold">
                    저장                </button>
                            <button class="deco-button px-6 py-3 font-bold">
                    공유                </button>
                            <button class="deco-button px-6 py-3 font-bold">
                    삭제                </button>
                    </div>

        <nav class="mt-12 flex justify-center space-x-8">
                            <a href="#" class="deco-button px-4 py-2">
                    홈                </a>
                            <a href="#" class="deco-button px-4 py-2">
                    소개                </a>
                            <a href="#" class="deco-button px-4 py-2">
                    서비스                </a>
                            <a href="#" class="deco-button px-4 py-2">
                    문의                </a>
                    </nav>
    </div>
</body>
</html>
