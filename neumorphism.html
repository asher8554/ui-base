<!DOCTYPE html>
<!-- AI UI 디자인 갤러리 정적 페이지 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴모피즘 디자인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #e0e5ec;
        }
        .neumorphic {
            background: #e0e5ec;
            box-shadow: 
                8px 8px 15px #a3b1c6,
                -8px -8px 15px #ffffff;
        }
        .neumorphic:hover {
            box-shadow: 
                inset 8px 8px 15px #a3b1c6,
                inset -8px -8px 15px #ffffff;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script defer src="theme.js"></script>
</head>
<body class="min-h-screen p-8">
    <a href="index.html" class="neumorphic fixed top-4 left-4 px-4 py-2 rounded-xl text-gray-700">← 돌아가기</a>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-gray-700 text-center mb-12">뉴모피즘 디자인</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="neumorphic p-8 rounded-2xl">
                    <div class="text-4xl mb-4">📄</div>
                    <h2 class="text-xl font-bold text-gray-700 mb-2">문서</h2>
                    <p class="text-gray-600">문서 관리 시스템</p>
                </div>
                            <div class="neumorphic p-8 rounded-2xl">
                    <div class="text-4xl mb-4">⚙️</div>
                    <h2 class="text-xl font-bold text-gray-700 mb-2">설정</h2>
                    <p class="text-gray-600">시스템 환경 설정</p>
                </div>
                            <div class="neumorphic p-8 rounded-2xl">
                    <div class="text-4xl mb-4">📊</div>
                    <h2 class="text-xl font-bold text-gray-700 mb-2">통계</h2>
                    <p class="text-gray-600">데이터 분석 및 통계</p>
                </div>
                    </div>

        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-6">
                            <button class="neumorphic p-4 rounded-xl text-gray-700 font-medium">
                    설정                </button>
                            <button class="neumorphic p-4 rounded-xl text-gray-700 font-medium">
                    저장                </button>
                            <button class="neumorphic p-4 rounded-xl text-gray-700 font-medium">
                    공유                </button>
                            <button class="neumorphic p-4 rounded-xl text-gray-700 font-medium">
                    삭제                </button>
                    </div>

        <nav class="mt-12 flex justify-center space-x-8">
                            <a href="#" class="neumorphic px-4 py-2 rounded-xl text-gray-700">
                    홈                </a>
                            <a href="#" class="neumorphic px-4 py-2 rounded-xl text-gray-700">
                    소개                </a>
                            <a href="#" class="neumorphic px-4 py-2 rounded-xl text-gray-700">
                    서비스                </a>
                            <a href="#" class="neumorphic px-4 py-2 rounded-xl text-gray-700">
                    문의                </a>
                    </nav>
    </div>
</body>
</html>
